services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tide
      POSTGRES_PASSWORD: tide
      POSTGRES_DB: tide
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tide -d tide"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://tide:tide@db:5432/tide
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
